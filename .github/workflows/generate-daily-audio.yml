name: Generate shared daily verse audio

# Regenerates the ElevenLabs audio for Verse.dailyVerses (see
# tool/generate_daily_audio.dart's doc comment) and publishes it to
# docs/audio/, which GitHub Pages serves — every user's app then downloads
# that one shared file (DailyAudioService) instead of each calling
# ElevenLabs individually for identical content.
#
# Triggers when the verse content itself changes, on a daily schedule, and
# via a manual button. The daily run exists because ElevenLabs' free tier
# has a monthly character quota far smaller than 365 verses' worth of
# audio: `tool/generate_daily_audio.dart` skips any verse whose audio is
# already cached (unchanged text, matching .sha256), so a run with nothing
# new to do costs nothing — it just re-confirms everyone's covered. Once
# quota resets each month, the next scheduled run naturally continues
# backfilling wherever the previous one left off, until every day of the
# year has real shared audio. See the top-level README's "Shared daily
# audio" section for the one-time repo setup this needs (the
# ELEVENLABS_API_KEY secret, enabling Pages).
on:
  push:
    branches: [master]
    paths:
      - "lib/models/verse.dart"
      - "tool/generate_daily_audio.dart"
  schedule:
    # 05:00 UTC daily — arbitrary; just needs to run more often than
    # ElevenLabs quota resets so the backlog keeps shrinking automatically.
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - run: flutter pub get

      - name: Generate audio for any changed/new verses
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Not a secret — a voice ID is public info, so this is a repo
          # *variable* (Settings → Secrets and variables → Actions →
          # Variables tab), not a secret. Optional: unset, this falls back
          # to ElevenLabsCore.defaultVoiceId ("Rachel") — but free ElevenLabs
          # accounts can't use most library/premade voice IDs via the API at
          # all (a 402 "Free users cannot use library voices" error) unless
          # that voice has been added to *your* account's "My Voices" first.
          # See the README's "Shared daily audio" section for the fix.
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: dart run tool/generate_daily_audio.dart

      # `if: always()` matters here: once quota runs out partway through a
      # big batch, the previous step exits non-zero (some verses failed,
      # not all), which would otherwise skip this step entirely — silently
      # discarding whatever *did* generate successfully before quota ran
      # out. Committing partial progress is exactly what lets the next
      # scheduled run continue rather than redo work.
      - name: Publish docs/audio if anything changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain docs/audio)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/audio
            git commit -m "Generate shared daily verse audio"
            git push
          else
            echo "No audio changes to publish."
          fi
